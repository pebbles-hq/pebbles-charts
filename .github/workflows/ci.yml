name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the gitleaks job escalates itself to upload SARIF.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (all targets)
        # Warn-only: [lints] in Cargo.toml is the source of truth and the hostile-input set
        # (indexing_slicing / arithmetic_side_effects / string_slice) has a known backlog.
        # Ratchet to `-- -D warnings` once it is burned down.
        run: cargo clippy --all-targets

      - name: Test
        # GPU-only tests are #[ignore]d and skipped here (CI runners have no GPU);
        # the CPU tests (unit, a11y, robustness, features) all run.
        run: cargo test --workspace


      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ───────────────────────────────────────────────────────────────────────────
  # cargo-audit — the RustSec advisory database. The SCA gate: it finds CVEs in the
  # DEPENDENCY graph. Reads the committed Cargo.lock, so it needs no build (and thus no
  # framework checkout) and no token or account.
  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit
      # Fails on any VULNERABILITY affecting the locked graph. Deliberately not
      # `--deny warnings`: unmaintained/yanked-crate policy belongs in deny.toml where it is
      # reviewable in-tree.
      - run: cargo audit

  # ───────────────────────────────────────────────────────────────────────────
  # cargo-deny — the supply-chain policy gate, driven by deny.toml: advisories, license
  # allow-list, duplicate/banned crates, and permitted source registries. Operates on the
  # lockfile, so no build is required. Split into named checks so a failure says WHICH
  # policy broke.
  # ───────────────────────────────────────────────────────────────────────────
  deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny
      - run: cargo deny check ${{ matrix.check }}

  # ───────────────────────────────────────────────────────────────────────────
  # Gitleaks — secrets/credentials committed anywhere in git HISTORY, not just the current
  # snapshot. Uses the CLI directly (the v2 action requires an org license). Results land
  # in Security → Code Scanning.
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION="v8.24.3"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Ensure SARIF file exists
        # Gitleaks writes no report when zero leaks are found, but upload-sarif requires the
        # file — emit a valid empty one.
        if: always()
        run: |
          [ -f gitleaks.sarif ] || cat <<'EOF' > gitleaks.sarif
          {"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","rules":[]}},"results":[]}]}
          EOF

      - name: Upload Gitleaks results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

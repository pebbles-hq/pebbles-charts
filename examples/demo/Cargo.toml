[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Same rev as the library's `pebbles` dep — otherwise cargo builds two copies of the
# framework and the demo's `IntoWidget`/`Widget` bounds don't match the lib's chart types.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "1d6e84177b954bd2517c9d1c1a601f64365249f1" }
pebbles-charts = { path = "../.." }

# Headless render (SHOT=<w>:<h>:<out.rgba>) — rasterize via vello_hybrid, no display.
vello = { version = "0.10", default-features = true }
vello_hybrid = "0.2"
wgpu = "29"
pollster = "1"

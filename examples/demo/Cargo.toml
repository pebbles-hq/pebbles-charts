[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Same rev as the library's `pebbles` dep — otherwise cargo builds two copies of the
# framework and the demo's `IntoWidget`/`Widget` bounds don't match the lib's chart types.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "2a3a995419bcb221dfec8ceec8fe3c513b1bf867" }
pebbles-charts = { path = "../..", version = "0.1.0" }


[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
pebbles = { git = "https://github.com/pebbles-hq/pebbles" }
pebbles-charts = { path = "../.." }

# Headless render (SHOT=<w>:<h>:<out.rgba>) — rasterize via vello_hybrid, no display.
vello = { version = "0.10", default-features = true }
vello_hybrid = "0.2"
wgpu = "29"
pollster = "1"

# pebbles-charts — composable chart widgets for the Pebbles GUI framework: bar, line,
# area, pie, and donut, with a config-driven palette + legend, drawn on the GPU canvas.
[workspace]
members = [".", "examples/demo"]

[package]
name = "pebbles-charts"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Composable, themeable chart widgets (bar, line, area, pie, donut) for the Pebbles GUI framework, drawn on the GPU canvas. Part of the Pebbles ecosystem."
authors = ["Reyco Seguma"]
license = "Apache-2.0"
repository = "https://github.com/pebbles-hq/pebbles-charts"
readme = "README.md"
keywords = ["charts", "graph", "visualization", "gui", "pebbles"]
categories = ["gui", "visualization"]

[features]
# Transitional render-backend forwarding (pebbles wgpu migration). Removed at the
# framework's Phase 6 (K24).
default = ["vello-hybrid"]
vello-hybrid = ["pebbles/vello-hybrid"]
wgpu = ["pebbles/wgpu"]

[dependencies]
# Pinned to a reviewed framework commit — `cargo update` won't silently ingest an
# unreviewed `main` HEAD. Bump the rev deliberately when adopting framework changes.
pebbles = { git = "https://github.com/pebbles-hq/pebbles", rev = "56ec7b068a627c216a6d654b9e53e0ed64fb201c", default-features = false }

# Warn-only lints (CI runs clippy warn-only until the backlog is measured; never bake
# `deny` into the manifest). The clippy set targets the hostile-input classes a charting
# library is exposed to: slicing/indexing panics and overflowing arithmetic on untrusted
# numeric data.
[lints.clippy]
all = { level = "warn", priority = -1 }
string_slice = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
